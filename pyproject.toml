[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sunspot-collusion"
version = "0.0.0"
description = "Scientific execution and analysis package for the Sunspot Collusion experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["collusion_experiment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
